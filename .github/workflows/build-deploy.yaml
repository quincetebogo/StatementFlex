      #       GH_TOKEN: ${{ github.token }}
      #   run: |
      #       PR_URL=$(gh pr create --base main --head release --title "Automatic release - version $RUN" --body "Image Deployed - ${{ needs.container.outputs.IMAGE }}")
      #       PR_NUMBER=$(echo "$PR_URL" | awk -F '/' '{print $NF}')
