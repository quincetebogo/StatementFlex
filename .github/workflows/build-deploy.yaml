name: Node Container Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/*
      - release/*
    types:
      - opened
      - synchronize
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/*.yaml'

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

env:
  JF_URL: ${{ vars.JF_URL }}
  JF_PROJECT_KEY: ${{ vars.JF_PROJECT_KEY }}
  DOCKER_REPO: ${{ vars.DOCKER_REPO }}
  JF_REPO: ${{ vars.JF_REPO }}
  JF_SIGNING_KEY: ${{ vars.JF_SIGNING_KEY }}
  RUN: ${{ github.run_number }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  BUILDLOCATION: './src/publish/out'
  BUILD_NAME: ${{ vars.SERVICE_NAME }}
  JF_BASE_URL: ${{ vars.JF_BASE_URL }}

jobs:
  build:
    name: Build Application
    runs-on: [ubuntu-22.04]
    if: ${{ (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      (startsWith(github.event.pull_request.base.ref, 'release/') ||
      startsWith(github.event.pull_request.base.ref, 'feature/'))) }}
    outputs:
      PROJECT_VERSION: ${{ steps.variables.outputs.PROJECT_VERSION }}
    container:
      image: capitecbank.jfrog.io/odin-docker-virtual/dotnet/sdk:6.0
      credentials:
        username: ${{ vars.JF_ACCESS_USER }}
        password: ${{ secrets.JF_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Set Project Version
        id: variables
        run: "echo \"PROJECT_VERSION=$(grep -oP '<Version>\\K[^<]+' ./src/Platform.Hosting.ASP.Core/Platform.Hosting.ASP.Core.csproj | awk 'NR==1')\" >> \"${GITHUB_OUTPUT}\" \n     #magic___^_^___line\n"
      - name: Install JFrog
        id: install-jf
        uses: jfrog/setup-jfrog-cli@v3
        env:
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Run JFrog Build
        id: run-jf
        run: |
          jf rt ping
          jf dotnet-config
          jf dotnetc --repo-resolve $JF_REPO
          jf nuget-config
          jf nugetc --repo-resolve $JF_REPO
          jf dotnet restore --build-name ${SERVICE_NAME}-name --build-number ${RUN} ./src/Platform.Hosting.ASP.Core/Platform.Hosting.ASP.Core.csproj
          jf dotnet test --no-restore --build-name ${SERVICE_NAME}-name --build-number ${RUN} ./src/Platform.Hosting.ASP.Core/Platform.Hosting.ASP.Core.csproj
          jf dotnet publish ./src/Platform.Hosting.ASP.Core/Platform.Hosting.ASP.Core.csproj --no-restore  --output ${BUILDLOCATION}
          jf rt build-collect-env $BUILD_NAME $RUN --project $JF_PROJECT_KEY
          jf rt build-publish $BUILD_NAME $RUN --project $JF_PROJECT_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ${{ env.BUILDLOCATION }}

  container:
    name: Build Container
    needs: [build]
    runs-on: [ubuntu-22.04]
    if: ${{ (github.event_name == 'workflow_dispatch') }}
    env:
      PROJECT_VERSION: ${{ needs.build.outputs.PROJECT_VERSION }}
    outputs:
      IMAGE: ${{ steps.docker-build.outputs.IMAGE }}

    steps:
      - name: Install JFrog
        id: install-jf
        uses: jfrog/setup-jfrog-cli@v3
        env:
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        with:
          version: latest
          download-repository: odin-jfrog-cli-remote

      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ${{ env.BUILDLOCATION }}

      - name: Docker Build
        id: docker-build
        run: |
          IMAGE=${JF_BASE_URL}/${DOCKER_REPO}/${SERVICE_NAME}:${PROJECT_VERSION}-${GITHUB_SHA::8}
          docker build -f Dockerfile --build-arg dll=Platform.Hosting.ASP.Core.dll --build-arg location=$BUILDLOCATION --iidfile=image-sha.txt -t $IMAGE .
          IMAGEFILE="${IMAGE}@$(cat image-sha.txt)"
          touch image-file.txt
          echo $IMAGEFILE >> image-file.txt
          echo " "
          echo "IMAGE=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "--------------------------------"
          cat image-file.txt
          echo "image: $IMAGE"
          echo "--------------------------------"

      - name: Login to Docker Registry
        id: docker-login
        uses: docker/login-action@v2
        with:
          registry: ${{ env.JF_URL }}
          username: ${{ vars.JF_ACCESS_USER }}
          password: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Docker Push
        id: docker-push
        run: jf docker push ${JF_BASE_URL}/${DOCKER_REPO}/${SERVICE_NAME}:${PROJECT_VERSION}-${GITHUB_SHA::8} --build-name ${BUILD_NAME} --project ${JF_PROJECT_KEY} --build-number $RUN

      - name: Publish Docker Info
        id: jf-docker-build-info
        run: jf rt build-publish $BUILD_NAME $RUN --project $JF_PROJECT_KEY

  deploy-dev:
    name: Deploy to DEV
    needs:
      - build
      - container
    runs-on:
      - ubuntu-22.04
    if: ${{ (github.event_name == 'workflow_dispatch') }}
    environment: dev
    steps:
      - name: Print Docker Image URI
        id: docker-image-uri
        run: |
          echo "image: ${{ needs.container.outputs.IMAGE }}"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Deploy via Argo to DEV
        id: argo-deploy
        uses: capitec-odin/action-deploy@v7
        with:
          repository: ${{ vars.GITOPS_REPO}}
          access-token: ${{ secrets.GITOPS_TOKEN }}
          component: ${{ vars.GITOPS_COMPONENT_NAME }}
          image: '${{ needs.container.outputs.IMAGE }}'
          org: ${{ vars.GITOPS_ORG }}
          enviro: dev
          jf-access-user: ${{ vars.JF_ACCESS_USER }}
          jf-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          jf-project-key: ${{ vars.JF_PROJECT_KEY }}


  deploy-int:
    name: Deploy to INT
    needs:
      - build
      - container
    runs-on:
      - ubuntu-22.04
    if: ${{ (github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) }}  
    environment: int
    steps:
      - name: Print Docker Image URI
        id: docker-image-uri
        run: |
          echo "image: ${{ needs.container.outputs.IMAGE }}"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Deploy via Argo to INT
        id: argo-deploy
        uses: capitec-odin/action-deploy@v7
        with:
          repository: ${{ vars.GITOPS_REPO}}
          access-token: ${{ secrets.GITOPS_TOKEN }}
          component: ${{ vars.GITOPS_COMPONENT_NAME }}
          image: '${{ needs.container.outputs.IMAGE }}'
          org: ${{ vars.GITOPS_ORG }}
          enviro: int
          jf-access-user: ${{ vars.JF_ACCESS_USER }}
          jf-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          jf-project-key: ${{ vars.JF_PROJECT_KEY }}


  create-release:
    name: Create Release
    runs-on:
      - ubuntu-22.04
    environment: release    
    if: ${{ (github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) }} 
    needs:
      - build
      - container
    env:
      IMAGE: ${{ needs.container.outputs.IMAGE }}
      PROJECT_VERSION: ${{ needs.build.outputs.PROJECT_VERSION }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Create GitHub Release
        id: gh-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $PROJECT_VERSION --target "${{ github.sha }}" --prerelease --generate-notes
          BODY=$(gh release view $PROJECT_VERSION --json body --jq '.body')
          echo "$BODY" >> release-notes.md
          echo "" >> release-notes.md
          echo "**Docker Image**:   ${IMAGE}" >> release-notes.md
          gh release edit $PROJECT_VERSION --notes-file release-notes.md

  deploy-qa:
    name: Deploy to QA
    needs:
      - build
      - container
      - create-release
    runs-on:
      - ubuntu-22.04
    environment: qa
    if: ${{ (github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) }} 
    steps:
      - name: Print Docker Image URI
        id: docker-image-uri
        run: |
          echo "image: ${{ needs.container.outputs.IMAGE }}"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Deploy via Argo to QA
        id: argo-deploy
        uses: capitec-odin/action-deploy@v7
        with:
          repository: ${{ vars.GITOPS_REPO}}
          access-token: ${{ secrets.GITOPS_TOKEN }}
          component: ${{ vars.GITOPS_COMPONENT_NAME }}
          image: '${{ needs.container.outputs.IMAGE }}'
          org: ${{ vars.GITOPS_ORG }}
          enviro: qa
          jf-access-user: ${{ vars.JF_ACCESS_USER }}
          jf-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          jf-project-key: ${{ vars.JF_PROJECT_KEY }}


  deploy-prod:
    name: Deploy to PROD
    needs:
      - build
      - container
      - create-release
      - deploy-qa
    runs-on:
      - ubuntu-22.04
    environment: prod
    if: ${{ (github.event_name == 'workflow_dispatch') && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) }} 
    steps:
      - name: Print Docker Image URI
        id: docker-image-uri
        run: |
          echo "Image: ${{ needs.container.outputs.IMAGE }}"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Deploy via Argo to Prod
        id: deploy
        uses: capitec-odin/action-deploy@v7
        with:
          repository: ${{ vars.GITOPS_REPO}}
          access-token: ${{ secrets.GITOPS_TOKEN }}
          component: ${{ vars.GITOPS_COMPONENT_NAME }}
          image: '${{ needs.container.outputs.IMAGE }}'
          org: ${{ vars.GITOPS_ORG }}
          enviro: prd
          jf-access-user: ${{ vars.JF_ACCESS_USER }}
          jf-access-token: ${{ secrets.JF_ACCESS_TOKEN }}
          jf-project-key: ${{ vars.JF_PROJECT_KEY }}

      - name: GitHub Auto Approve PR to Main
        id: pull-request-create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create --base main --head "${{ github.ref_name }}" --title "Automatic release - version $RUN" --body "Image Deployed - ${{ needs.container.outputs.IMAGE }}")
          PR_NUMBER=$(echo "$PR_URL" | awk -F '/' '{print $NF}')
          echo "PR URL: $PR_URL"
          echo "PR NUMBER: $PR_NUMBER"