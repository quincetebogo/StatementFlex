variables:
  Platform: "ocwp" # The specific Platform used.
  TeamName: "cec" # Name of the team managing this project
  MODIFY_ALIAS: "false" # True to update alias to route to CKS
  IS_PRE_RELEASE: "true"
  PF_ENVIRONMENT: "dev"
  PF_NEED: "deploy"
  PF_DEVELOP_AUTO_DEPLOY: "true"
 
include:
  - project: 'platform/pipeline-utils/deployment-scripts'
    file: '.platform-ci.yml'